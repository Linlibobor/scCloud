# scCloud — rootless / 共享机叠加层
# 用法:
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.rootless.yml up -d
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.rootless.yml
#
# 相对基础 compose：
#   - 全部服务改为 restart: always
#   - 监听地址统一由 .env 中的 WEB_BIND_ADDRESS 控制（仅本机/SSH 转发设 127.0.0.1，局域网设 0.0.0.0）
#     不在此重复声明 ports，避免 Compose 列表合并产生重复端口绑定冲突。
# secrets / read_only / cap_drop / digest pin 仍继承主文件。
# 不在此强制清 pids_limit（compose 版本差异大；rootless 下超限通常被忽略）。

name: sccloud

services:
  web:
    restart: always

  frontend:
    restart: always

  backend:
    restart: always

  r-engine:
    restart: always

  r-engine-worker:
    restart: always

  db:
    restart: always

  redis:
    restart: always
